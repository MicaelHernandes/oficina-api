[www]
; Escuta em TCP para o nginx sidecar (mesmo pod, 127.0.0.1).
listen = 0.0.0.0:9000
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
; Health status do php-fpm (usado por probes se necessário).
pm.status_path = /fpm-status
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
