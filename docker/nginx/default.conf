# nginx do sidecar: serve estáticos de public/ e faz fastcgi para o php-fpm
# (127.0.0.1:9000, mesmo pod). Código compartilhado via volume.
server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 25m;

    # Logs de acesso em JSON no stdout (correlação por request_id).
    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"rt":$request_time,'
        '"request_id":"$http_x_request_id",'
        '"amzn_trace":"$http_x_amzn_trace_id",'
        '"ua":"$http_user_agent"'
    '}';
    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
