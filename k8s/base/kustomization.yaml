apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# O Job de migrations (migrate-job.yaml) NÃO entra aqui: é aplicado
# separadamente pela pipeline (delete + apply) para evitar conflito com
# campos imutáveis de Job já concluído.
resources:
  - serviceaccount.yaml
  - configmap.yaml
  - nginx-configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - redis.yaml
  - queue-worker.yaml
  - scheduler.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - dashboards.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: oficina
    includeSelectors: false
